<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Browse the colors, typography, icons, components, and motion of Sort & Score.">
<title>Design Language | Sort &amp; Score</title>
<style id="directory-style">
  .directory-header { border-bottom: var(--edge); background: var(--paper); }
  .directory-header a { font-weight: 700; }
  .directory-hero { background: var(--green); border-bottom: var(--edge); padding-block: clamp(2.5rem, 7vw, 5rem); }
  .directory-hero h1 { font-size: clamp(3rem, 8vw, 6rem); }
  .directory-tools { display: flex; flex-wrap: wrap; gap: 1rem; align-items: end; margin-block: 1.5rem; }
  .directory-tools label { display: grid; gap: .25rem; font-weight: 700; }
  .directory-tools label:first-child { flex: 1 1 16rem; }
  .directory-tools :is(input, select) { min-width: 0; min-height: 44px; padding: .45rem .6rem; font: inherit; border: var(--edge); border-radius: 0; background: var(--paper); color: var(--ink); }
  .directory-tools button { border: var(--edge); min-height: 44px; padding: .45rem .75rem; background: var(--yellow); color: var(--ink); font: inherit; font-weight: 700; cursor: pointer; }
  .directory-tools button[aria-pressed="true"] { background: var(--mint); }
  #directory-results { margin-bottom: 1rem; }
  .directory-group { padding-block: 1.5rem 2.5rem; border-top: var(--edge); }
  .directory-group h2 { font-size: clamp(2rem, 5vw, 3.3rem); margin-bottom: 1.25rem; }
  .directory-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 22rem), 1fr)); gap: 1rem; }
  .directory-entry { min-width: 0; padding: 1rem; border: var(--edge); background: var(--paper); }
  #color-palette { grid-column: 1 / -1; }
  .directory-entry + .directory-entry { border-top: var(--edge); }
  .directory-entry > h3 { margin-bottom: .35rem; }
  .directory-entry > p { max-width: 64ch; }
  .directory-preview { margin-top: .9rem; }
  .directory-preview .hero-art { margin: .5rem .5rem .5rem 0; }
  .directory-preview .marquee-group { min-width: 0; }
  .directory-preview .scan-panel { margin-right: .35rem; }
  .directory-preview .jump { margin-top: 0; }
  .directory-preview .reward-grid { grid-template-columns: 1fr; margin-top: 0; }
  .directory-preview .receipt { margin-inline: .5rem; width: calc(100% - 1rem); }
  .directory-preview .counts dd { font-size: clamp(2.25rem, 5vw, 3.5rem); }
  .directory-preview .site-header .wrap, .directory-preview .process .wrap { width: calc(100% - 1.5rem); }
  .directory-preview .process ol { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .directory-preview .process a { flex-direction: column; align-items: start; }
  .type-specimen { display: grid; gap: .65rem; padding: .85rem; border: var(--edge); background: var(--mint); }
  .type-specimen .display-type { font: 900 clamp(2rem, 6vw, 3.6rem)/.97 "Arial Black", "Avenir Next", sans-serif; letter-spacing: -.065em; }
  .type-specimen .label-type { font: 700 .8rem/1 monospace; }
  .swatch-grid, .icon-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 7.5rem), 1fr)); gap: .65rem; }
  .swatch { display: grid; min-height: 5.2rem; align-content: end; text-align: left; padding: .45rem; border: var(--edge); color: var(--swatch-ink, var(--ink)); background: var(--swatch); font: inherit; cursor: pointer; }
  .swatch code { font-size: .85rem; }
  .icon-specimen { display: grid; justify-items: center; align-content: center; min-height: 6rem; gap: .35rem; padding: .45rem; border: var(--edge); background: var(--mint); text-align: center; font-weight: 700; }
  .icon-specimen svg { width: 2.75rem; height: 2.75rem; }
  .sample-row { display: flex; flex-wrap: wrap; align-items: center; gap: .65rem; }
  .directory-entry ul.notes { padding-inline-start: 1.2rem; margin-bottom: 0; }
  .directory-entry li + li { margin-top: .25rem; }
  .directory-preview .ledger li + li { margin-top: 0; }
  .copy-status { min-height: 1.5rem; margin-top: .6rem; font-size: .9rem; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<a class="skip" href="#directory">Skip to the directory</a>
<header class="directory-header">
  <div class="wrap bar"><strong>Sort &amp; Score / Design directory</strong><a href="index.html">Open the prototype</a></div>
</header>
<main id="directory">
  <div class="directory-hero">
    <div class="wrap">
      <p class="kicker">Sort &amp; Score</p>
      <h1>Design language</h1>
      <p class="lede">Browse the colors, icons, components, and motion behind the recycling prototype. Try the live examples as you go.</p>
    </div>
  </div>
  <div class="wrap">
    <div class="directory-tools" hidden>
      <label>Search the directory<input type="search" id="directory-search" placeholder="Try “shadow”, “scanner”, or “badge”"></label>
      <label>Category<select id="directory-category"><option value="">All categories</option></select></label>
      <button type="button" id="directory-motion" aria-pressed="false">Pause previews</button>
    </div>
    <p id="directory-results" role="status">Loading the prototype previews…</p>
    <div id="directory-catalog"></div>
  </div>
</main>
<footer><div class="wrap">Sort &amp; Score design directory · <a href="#directory">Back to top</a></div></footer>
<noscript><p class="wrap">Enable JavaScript to browse the interactive previews. <a href="index.html">Open the prototype</a>.</p></noscript>
<script>
(async () => {
  const catalog = document.querySelector("#directory-catalog");
  const results = document.querySelector("#directory-results");
  try {
    const response = await fetch("index.html");
    if (!response.ok) throw new Error("Prototype preview source is unavailable");
    const source = new DOMParser().parseFromString(await response.text(), "text/html");
    document.head.insertBefore(document.importNode(source.querySelector("style"), true), document.querySelector("#directory-style"));
    document.body.prepend(document.importNode(source.querySelector(".icon-library"), true));

    const groups = {
      Foundations: [
        ["Color palette", "Lime leads, cream provides breathing room, mint and yellow distinguish status, and blue frames the scanner and SMS. Select a swatch to copy its hex value.", "palette"],
        ["Type and hierarchy", "Heavy display type for headlines, Trebuchet MS for reading and controls, and monospace for numbered steps.", "type"],
        ["Borders, shadows and spacing", "The prototype uses square corners, 3 px dark borders, and hard 5 px offset shadows. The hero art uses a larger 9 px shadow. Content is centered in a 74 rem wrap with responsive gutters.", "structure"],
        ["Responsive layout", "The hero, section, and Rewards grids collapse to one column at 48 rem. Report statistics retain a two-column grid. Below 25 rem, activity and reward ledger rows stack while material rows keep their point values inline.", "layout"]
      ],
      Identity: [
        ["Icon library", "Seven shared SVGs cover the brand, scanner arrow, and five recyclable or compostable materials. Dark outlines, colored fills, and small highlights keep the illustrations readable at compact sizes.", "icons"],
        ["Header and navigation", "The leaf wordmark, section links, and green Scan link introduce the prototype. The original links open their matching site sections.", ".site-header"],
        ["Hero receipt and stickers", "The tilted receipt pairs a large points balance with a status badge and dashed divider. Material stickers float above a scrolling polka-dot field.", ".hero-art"],
        ["Material marquee", "Two matching tracks create a seamless loop. This component has its own pause control, which also stops other preview loops.", ".marquee"],
        ["Process navigation", "Three numbered steps connect scanning, activity, and rewards. The strip uses lime numerals over a dark background.", ".process"]
      ],
      Controls: [
        ["Primary action", "A yellow action with a filled arrow. The hard shadow grows on hover and compresses on press. A visible outline marks keyboard focus.", ".jump"],
        ["Scanner controls and status", "Choose a demo bin, expand its location, and scan a sample material. The status panel announces the result. The scan button blocks repeated activation while a scan is running.", ".scan-panel"],
        ["Status badges", "Mint is used for accepted or eligible states, and yellow for pending or unmet states. Text communicates the state directly.", "badges"]
      ],
      Components: [
        ["Disposal activity", "A ledger uses rules to separate rows and status badges to show the outcome of each deposit.", "#resident .ledger"],
        ["Rewards and redemption", "Material points and sample rewards share the ledger pattern. The reward face lifts above a stationary shadow, and the redemption example expands with a native disclosure.", ".reward-grid"],
        ["Barangay report", "A two-by-two set of colored statistic cards pairs prominent values with compact labels. The cards rock in 2D while the values stay the same size.", ".counts"],
        ["SMS preview", "A blue message card with a cream label illustrates the text a resident could receive after a deposit.", "#sms blockquote"],
        ["Footer", "A mint closing strip identifies the student prototype and offers a return link.", "body > footer"]
      ],
      Motion: [
        ["Motion and hover rules", "The live previews above run the original motion and controls. Use Pause previews or your device’s reduced-motion setting to stop decorative movement.", "motion"]
      ]
    };

    const text = (tag, value, className) => {
      const node = document.createElement(tag);
      node.textContent = value;
      if (className) node.className = className;
      return node;
    };
    const coreColors = {
      Paper: "--paper", Ink: "--ink", Lime: "--green", Mint: "--mint", Yellow: "--yellow", Blue: "--blue"
    };
    const iconNames = {
      brand: "Leaf mark", down: "Scanner arrow", paper: "Paper", plastic: "Plastic", metal: "Metal", glass: "Glass", food: "Food scraps"
    };
    const notes = (values) => {
      const list = document.createElement("ul");
      list.className = "notes";
      list.append(...values.map((value) => text("li", value)));
      return list;
    };

    function renderPreview(kind, preview) {
      if (kind === "palette") {
        const swatches = document.createElement("div");
        swatches.className = "swatch-grid";
        const notice = text("p", "", "copy-status");
        notice.setAttribute("role", "status");
        const style = getComputedStyle(document.documentElement);
        const colors = Object.entries(coreColors).map(([name, token]) => [name, style.getPropertyValue(token).trim()]);
        const core = new Set(colors.map(([, hex]) => hex.toLowerCase()));
        const sourceColors = source.querySelector("style").textContent + source.body.innerHTML;
        const accents = new Set(sourceColors.toLowerCase().match(/#[\da-f]{6}\b/g) || []);
        for (const [name, hex] of [...colors, ...[...accents].filter((hex) => !core.has(hex)).map((hex) => ["Accent", hex])]) {
          const swatch = text("button", "", "swatch");
          swatch.type = "button";
          swatch.style.setProperty("--swatch", hex);
          const [r, g, b] = hex.slice(1).match(/../g).map((part) => parseInt(part, 16) / 255);
          const linear = (channel) => channel <= .04045 ? channel / 12.92 : ((channel + .055) / 1.055) ** 2.4;
          if (.2126 * linear(r) + .7152 * linear(g) + .0722 * linear(b) < .19) swatch.style.setProperty("--swatch-ink", "#fffdf2");
          swatch.append(text("strong", name), text("code", hex));
          swatch.addEventListener("click", async () => {
            try {
              await navigator.clipboard.writeText(hex);
              notice.textContent = "Copied " + hex;
            } catch {
              notice.textContent = "Hex value " + hex;
            }
          });
          swatches.append(swatch);
        }
        preview.append(swatches, notice);
      } else if (kind === "type") {
        const specimen = document.createElement("div");
        specimen.className = "type-specimen";
        specimen.append(text("p", "Recycle. Earn points.", "display-type"), text("p", "Follow a smart-bin deposit from sorting to rewards."), text("p", "01   SCAN A DEPOSIT", "label-type"));
        preview.append(specimen);
      } else if (kind === "icons") {
        const grid = document.createElement("div");
        grid.className = "icon-grid";
        for (const [key, label] of Object.entries(iconNames)) {
          const tile = document.createElement("div");
          tile.className = "icon-specimen";
          const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
          svg.setAttribute("viewBox", key === "brand" ? "0 0 40 40" : "0 0 24 24");
          svg.setAttribute("aria-hidden", "true");
          const use = document.createElementNS(svg.namespaceURI, "use");
          use.setAttribute("href", "#icon-" + key);
          svg.append(use);
          tile.append(svg, text("span", label));
          grid.append(tile);
        }
        preview.append(grid);
      } else if (kind === "badges") {
        const row = document.createElement("div");
        row.className = "sample-row";
        for (const label of ["Accepted", "Pending review", "Within balance", "30 more points needed"]) {
          row.append(text("span", label, /Pending|needed/.test(label) ? "badge held" : "badge"));
        }
        preview.append(row);
      } else if (kind === "structure") {
        preview.append(notes(["Default edge · 3 px solid ink", "Card shadow · 5 px right and down", "Controls · 44 px minimum height", "Receipt · 6 px shadow and dashed rule", "Hero art · 9 px shadow and 16 px dot grid"]));
      } else if (kind === "layout") {
        preview.append(notes(["Hero · headline and receipt art", "Content sections · description and working example", "Rewards · two ledgers, stacked on narrow screens", "Report · 2 × 2 statistic cards"]));
      } else if (kind === "motion") {
        preview.append(notes(["Hero · falling dots, floating stickers, and a one-time receipt entrance", "Marquee · continuous material loop", "Scanner · swaying leaves and idle shine, then a separate scan beam when activated", "Activity · staggered horizontal row movement", "Rewards · slow lift with a fixed shadow", "Report · flat left-right card tilt", "SMS · gentle side-to-side motion", "Pointer hover · card face lifts and pauses its idle loop. The scanner’s interior keeps moving.", "Touch and reduced motion · no hover lift on touch. Reduced motion disables decorative loops."]));
      } else {
        const original = source.querySelector(kind);
        if (!original) throw new Error("Missing component: " + kind);
        const clone = document.importNode(original, true);
        clone.querySelectorAll("a[href^='#']").forEach((link) => link.setAttribute("href", "index.html" + link.getAttribute("href")));
        if (clone.matches("a[href^='#']")) clone.setAttribute("href", "index.html" + clone.getAttribute("href"));
        preview.append(clone);
      }
    }

    const category = document.querySelector("#directory-category");
    for (const [name, entries] of Object.entries(groups)) {
      category.append(new Option(name, name));
      const group = document.createElement("div");
      group.className = "directory-group";
      group.dataset.category = name;
      group.append(text("h2", name));
      const grid = document.createElement("div");
      grid.className = "directory-grid";
      for (const [title, description, kind] of entries) {
        const entry = document.createElement("section");
        entry.className = "directory-entry";
        entry.id = title.toLowerCase().replace(/[^a-z0-9]+/g, "-");
        const preview = document.createElement("div");
        preview.className = "directory-preview";
        renderPreview(kind, preview);
        entry.append(text("h3", title), text("p", description), preview);
        grid.append(entry);
      }
      group.append(grid);
      catalog.append(group);
    }

    const search = document.querySelector("#directory-search");
    const filter = () => {
      const query = search.value.trim().toLowerCase();
      let count = 0;
      for (const group of catalog.children) {
        let visible = 0;
        for (const entry of group.querySelectorAll(".directory-entry")) {
          entry.hidden = Boolean(category.value && category.value !== group.dataset.category) || !entry.textContent.toLowerCase().includes(query);
          if (!entry.hidden) visible++;
        }
        group.hidden = visible === 0;
        count += visible;
      }
      results.textContent = count ? count + (count === 1 ? " entry" : " entries") : "No matching entries. Try a different search or category.";
    };
    search.addEventListener("input", filter);
    category.addEventListener("change", filter);
    const prototype = document.createElement("script");
    prototype.src = "prototype.js";
    prototype.addEventListener("load", () => {
      const globalToggle = document.querySelector("#directory-motion");
      const sync = () => {
        const paused = document.body.classList.contains("motion-paused");
        globalToggle.setAttribute("aria-pressed", String(paused));
        globalToggle.textContent = paused ? "Resume previews" : "Pause previews";
      };
      const marqueeToggle = document.querySelector(".motion-toggle");
      globalToggle.addEventListener("click", () => marqueeToggle.click());
      marqueeToggle.addEventListener("click", sync);
      document.querySelector(".directory-tools").hidden = false;
    });
    prototype.addEventListener("error", () => {
      results.textContent = "The catalog loaded, but the live controls are unavailable.";
    });
    document.body.append(prototype);
    filter();
    if (location.hash) document.getElementById(location.hash.slice(1))?.scrollIntoView();
  } catch (error) {
    console.error(error);
    results.textContent = "Couldn’t load the live previews. Open this directory through the hosted site or a local web server.";
  }
})();
</script>
</body>
</html>
